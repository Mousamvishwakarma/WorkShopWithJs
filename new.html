<!DOCTYPE html>
<html>
<head>
    <title>Todo App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        h1 {
            text-align: center;
        }

        .container {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }

        .column {
            width: 300px;
            height: 500px;
            border: 1px solid black;
            padding: 10px;
            border-radius: 10px;
            overflow-y: auto;
        }

        .task {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid gray;
            padding: 5px 10px;
            margin-top: 8px;
            border-radius: 5px;
        }

        form {
            text-align: center;
            margin-top: 20px;
        }

        input[type="text"] {
            padding: 8px;
            width: 200px;
        }

        input[type="submit"] {
            padding: 8px 12px;
            cursor: pointer;
        }

        button {
            cursor: pointer;
        }
    </style>

    <script src="new.js" defer></script>
</head>
<body>
    <div>
        <h1>Todo App 📝</h1>

        <form onsubmit="addTask(event)">
            <input type="text" placeholder="Enter your task..." required />
            <input type="submit" value="Add Task" />
        </form>

        <div class="container">
            <div class="column" id="todo">
                <h3>Todo</h3>
            </div>
            <div class="column" id="progress">
                <h3>In Progress</h3>
            </div>
            <div class="column" id="done">
                <h3>Done</h3>
            </div>
        </div>
    </div>
</body>
</html>
